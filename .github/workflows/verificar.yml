name: Verificar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      # Barra vulnerabilidades críticas. Os alertas atuais (moderados/altos nas
      # ferramentas de build do Expo) estão registrados em docs/auditoria-de-seguranca.md.
      - run: npm audit --omit=dev --audit-level=critical
